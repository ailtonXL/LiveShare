name: Import LiveForge project
on:
  push:
    branches: [main]
    paths:
      - liveforge-upload/READY
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source into repository
        shell: bash
        run: |
          set -euo pipefail
          cat liveforge-upload/part-* | base64 --decode > /tmp/liveforge-upload.tar.xz
          echo "b579acd4f00979c090bb3b7274cd03747c0da2c4bb7bcb03d227ea84a671053d  /tmp/liveforge-upload.tar.xz" | sha256sum -c -
          mkdir -p /tmp/liveforge-extract
          tar -xJf /tmp/liveforge-upload.tar.xz -C /tmp/liveforge-extract
          cp -a /tmp/liveforge-extract/LiveForge/. .
          rm -rf liveforge-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import LiveForge site source files" || exit 0
          git push
