name: Import LiveForge 2.0
on:
  push:
    branches: [main]
    paths: [liveforge-upload/READY]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import LiveForge 2.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat liveforge-upload/part-* | base64 --decode > /tmp/liveforge2.tar.xz
          echo "75ce7cc75d78caab64a065aacbaddb7f541a3a57285606d1b480f3f6265f823c  /tmp/liveforge2.tar.xz" | sha256sum -c -
          mkdir -p /tmp/liveforge2
          tar -xJf /tmp/liveforge2.tar.xz -C /tmp/liveforge2
          cp -a /tmp/liveforge2/LiveForge/. .
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock_path=Path("package-lock.json")
          if lock_path.exists():
              lock=json.loads(lock_path.read_text())
              pkg=json.loads(Path("package.json").read_text())
              lock["version"]=pkg["version"]
              lock["packages"][""]["version"]=pkg["version"]
              lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2)+"\n")
          PY
          rm -rf liveforge-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update LiveShare to LiveForge 2.0" || exit 0
          git push
