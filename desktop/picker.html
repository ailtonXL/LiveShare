<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:">
  <title>Escolher fonte de captura</title>
  <style>
    body { background: #0a0d16; color: #edf2fa; font: 15px system-ui; margin: 24px; }
    h1 { font-size: 21px; }
    #sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    button { background: #151c2d; color: inherit; border: 1px solid #34405a; border-radius: 8px; padding: 10px; font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { border-color: #82f5c2; }
    button img { width: 100%; height: 90px; object-fit: contain; margin-bottom: 6px; }
    button span { display: block; overflow-wrap: anywhere; }
    #cancel { margin-top: 16px; }
  </style>
  <script defer src="picker.js"></script>
</head>
<body>
  <h1>O que você quer compartilhar?</h1>
  <div id="sources"></div>
  <button id="cancel" type="button">Cancelar</button>
</body>
</html>
